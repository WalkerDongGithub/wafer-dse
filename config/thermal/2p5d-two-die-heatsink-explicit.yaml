# 2.5D + 散热板显式（heatsink 三段链）—— 两 die 经 TIM→heatsink→ambient
#
# 传热路径（heatsink 是显式节点，作者要求看完整散热链）：
#   die0 ──face_adjacency── die1                (interposer 横向面邻接)
#   die0 ──tim── heatsink                       (die → 散热板：TIM 接触热阻)
#   die1 ──tim── heatsink
#   heatsink ──heatsink_ambient── ambient       (散热板 → 环境：对流 h·A)
#
# 节点类型 heatsink = 自由节点（有温度、有散热路径），非 boundary。
# 边类型：tim（接触热阻，r_tim_k_per_w）、heatsink_ambient（对流，
# h_w_per_m2k × 面积）。对照 2p5d-two-die-heatsink.yaml（boundary 简化版）。

name: 2p5d-two-die-heatsink-explicit
t_max_k: 358.15

nodes:
  - id: die0
    type: die
    geometry: {x_mm: 0.0, y_mm: 0.0, w_mm: 12.0, h_mm: 12.0}
  - id: die1
    type: die
    geometry: {x_mm: 13.0, y_mm: 0.0, w_mm: 12.0, h_mm: 12.0}
  - id: heatsink
    type: heatsink
  - id: ambient
    type: boundary
    temperature_k: 300.0

edges:
  - type: face_adjacency
    between: [die0, die1]
    k_interposer_w_mk: 150.0
    t_interposer_mm: 0.1
  - type: tim
    from: die0
    to: heatsink
    r_tim_k_per_w: 0.3
  - type: tim
    from: die1
    to: heatsink
    r_tim_k_per_w: 0.3
  - type: heatsink_ambient
    from: heatsink
    to: ambient
    h_w_per_m2k: 100.0
    area_m2: 0.0144       # 12×12mm die 的散热板底部面积
