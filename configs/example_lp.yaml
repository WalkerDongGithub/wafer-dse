# 统一 LP DSE 示例配置
requirement:
  target_nonblocking_gbps_per_port: 800
  max_power_w: 200
  port_count: 12
  max_die_area_mm2: 800
  strictness:
    mode: full

topologies:
  dragonfly_small:
    kind: dragonfly
    a: 2
    p: 2
    h: 1
    routes: [det]
  dragonfly_medium:
    kind: dragonfly
    a: 4
    p: 4
    h: 2
    routes: [det]
  mesh4:
    kind: mesh
    size: 4
    routes: [det]

output:
  directory: outputs/lp_demo
