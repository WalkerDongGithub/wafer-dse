requirement:
  # 用户目标：每端口 800G 无阻塞，峰值功耗低于 200W。
  target_nonblocking_gbps_per_port: 800
  max_power_w: 200
  port_count: 16
  max_die_area_mm2: 800
  packaging_config: example_packaging.yaml
  strictness:
    mode: full

topologies:
  mesh4:
    kind: mesh
    size: 4
    routes: [det, val]
  torus4:
    kind: torus
    size: 4
    routes: [det, val]
  dragonfly_small:
    kind: dragonfly
    a: 2
    p: 2
    h: 1
    routes: [det, val]

output:
  directory: ../outputs/example_run
