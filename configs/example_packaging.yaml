packaging:
  # 基本上限：用于封装级硬筛。
  max_die_area_mm2: 800
  max_power_w: 220

  # lane 假设：800G 目标在 100G/lane 下需要 8 lanes。
  lane_rate_gbps: 100
  max_external_lanes: 160
  max_internal_lanes: 1600

  # 面积模型：固定面积 + router + external lanes + internal lanes。
  base_die_area_mm2: 40
  router_area_mm2: 1.5
  area_per_external_lane_mm2: 0.08
  area_per_internal_lane_mm2: 0.025

  # 功耗模型：固定功耗 + router + external lanes + internal lanes。
  base_power_w: 20
  router_power_w: 0.8
  power_per_external_lane_w: 0.35
  power_per_internal_lane_w: 0.045
