# =============================================================================
# 封装工艺配置文件 — UCIe 2.0 中规中矩基线
# =============================================================================
#
# 技术选型基准：
#   外部端口  → 100G/lane Ethernet SerDes (OIF-CEI-112G / IEEE 802.3ck)
#   D2D 互连  → UCIe Advanced Package (2.5D), 16 GT/s, 45μm pitch
#   Package   → UCIe Standard Package (2D), 16 GT/s, 110μm pitch
#   Router    → 28nm NoC 文献数据
#
# 设计哲学：优先鲁棒性。16 GT/s 是 UCIe 1.0 (2022) 量产验证的基线，
# 无需均衡器，0.5V 低压供电，功耗最低。以此为基础，其他配置在此基础上
# 做权衡（换 32G、换 25μm pitch、换更快 SerDes 等）。
# =============================================================================

packaging:

  # ===========================================================================
  # 一、全局约束
  # ===========================================================================

  # 光罩极限 (reticle limit)。28nm 约 700-800 mm²，一个 die 不能超过此值。
  max_die_area_mm2: 800

  # 封装散热能力上限 (TDP)。取 min(req.max_power_w, 此值)。
  max_power_w: 220

  # ===========================================================================
  # 二、外部端口 — 100G/lane Ethernet SerDes
  # ===========================================================================
  #
  # 这些是"交换机连接到外部世界"的端口，走长距离封装基板/PCB，
  # 物理层是传统 Ethernet SerDes，不是 UCIe。
  #
  # 数据来源：OIF-CEI-112G 标准、商用 SerDes IP datasheet (Synopsys/Cadence)
  #
  # 换算速查：
  #   100G NRZ → Nyquist 50 GHz → 需要强力均衡 → 面积和功耗都是 D2D 的 5-10 倍
  #   lanes_per_port = ceil(800 / 100) = 8 lanes/port

  ext_lane_rate_gbps: 100             # 外部 SerDes lane 速率

  max_external_lanes: 160             # 封装基板能引出多少 lane (escape routing 能力)
  max_internal_lanes: 1600            # 内部链路总 lane 预算 (基板 + interposer 走线资源)
                                      # 160 × 100G = 16 Tbps 总外部带宽上限
                                      # 等效 160/8 = 20 个 800G 端口

  area_per_external_lane_mm2: 0.08    # 外部 SerDes PHY 面积 (/lane)
                                      # 包含: PLL, CDR, CTLE, DFE, TX driver
                                      # DFE tap 多 (长距需要 ~20+ tap) → 面积大

  power_per_external_lane_w: 0.35     # 外部 SerDes PHY 功耗 (/lane)
                                      # 100G/lane × ~3.5 pJ/bit ≈ 0.35W
                                      # 一根 800G 端口 = 8×0.35 = 2.8W PHY 功耗

  # ===========================================================================
  # 三、D2D 互连 — UCIe Advanced Package (2.5D), 16 GT/s, 45μm bump pitch
  # ===========================================================================
  #
  # 这是 die-to-die 走硅中介层 (interposer, e.g. CoWoS) 或 EMIB 的互连。
  # UCIe 1.0 基准速率，最成熟的 D2D PHY 配置。
  #
  # 数据来源：UCIe 2.0 Spec Table 1-2, Table 1-4, Section 5.7.2
  #
  # 关键特征：
  #   - 通道长度 ≤ 2 mm（interposer 上芯片间距）
  #   - 0.5V 低压供电，功耗最低档
  #   - x64 module @45μm: ~0.4 mm²/64lane → 0.006 mm²/lane (纯 PHY)
  #   - 无需均衡器 (≤12G BER 1e-27, 16G 亦可沿用此目标)
  #
  # 换算速查：
  #   16G/lane × 0.25 pJ/bit = 0.004 W/lane (纯 PHY)
  #   800G 端口等效 = ceil(800/16) = 50 lane
  #   边沿密度 ≈ 1/45μm × 0.45 利用率 ≈ 10 lane/mm

  int_lane_rate_gbps: 16              # UCIe D2D lane 速率 (GT/s = Gbps for NRZ)

  d2d_bump_pitch_um: 45               # bump pitch，决定 PHY 密度
  d2d_channel_reach_mm: 2             # 通道硬上限 (Advanced Package spec)

  # D2D 面积模型
  area_per_internal_lane_mm2: 0.012   # D2D PHY + interposer 走线
                                      # 拆解: PHY 0.006 + die 侧布线 0.006

  # D2D 功耗模型
  power_per_internal_lane_w: 0.005    # 16G × 0.25 pJ/bit + 25% margin = 0.005W

  # D2D 边沿预算 (用于跨 die 链路带宽检查)
  d2d_lanes_per_mm_edge: 10           # 1/45μm × 0.45 = 10 lane/mm (可用)
  d2d_ber: "1e-27"                    # 目标 BER (≤12G 标准; 16G 参考)

  # ===========================================================================
  # 四、Package 基板互连 — UCIe Standard Package (2D), 16 GT/s, 110μm pitch
  # ===========================================================================
  #
  # 这是 die 之间走有机基板 (organic substrate, e.g. FC-BGA) 的互连。
  # 距离比 interposer 长 (10-25mm)，损耗更大，PHY 功耗更高。
  #
  # 数据来源：UCIe 2.0 Spec Table 1-1, Table 1-4, Section 5.7.3
  #
  # 换算速查：
  #   Standard @16G: 1.0 pJ/bit @1.0V → 0.016 W/lane
  #   通道: 50Ω 阻抗控制, Nyquist 损耗 < -6.5dB (≤16G)
  #   边沿密度 ≈ 1/110μm × 0.45 ≈ 4 lane/mm

  pkg_bump_pitch_um: 110              # 标准 flip-chip bump pitch
  pkg_channel_reach_mm: 10            # 短距离 (short reach)，10mm 无需均衡器
                                      # 长距离 (25mm) 需要额外走线优化

  pkg_area_per_lane_mm2: 0.04         # 基板 PHY 面积 (比 D2D 大 3-4×)
  pkg_power_per_lane_w: 0.016         # 16G × 1.0 pJ/bit
  pkg_lanes_per_mm_edge: 4            # 1/110μm × 0.45
  pkg_impedance_ohm: 50               # 特征阻抗 (标准)

  # ===========================================================================
  # 五、Die 内 Router — 28nm NoC 文献数据
  # ===========================================================================
  #
  # 数据来源：
  #   Intel Teraflops (65nm 5-port 0.34mm² → 28nm 等效 ~0.09mm²)
  #   Princeton Piton (32nm 5-port 0.11mm² → 28nm 等效 ~0.09mm²)
  #   MIT SCORPIO (45nm 5-port 0.18mm² → 28nm 等效 ~0.07mm²)
  #
  # 当前取 1.5 mm² for 5-port，对应 0.3 mm²/port，在 28nm 下合理偏保守。
  # buffer-heavy 设计 (8VC×16depth×256bit) 会更大，~0.4 mm²/port。
  #
  # 跨工艺缩放：面积 ∝ (工艺节点)²，7nm ≈ 28nm 面积的 1/16。

  router_area_mm2: 1.5                # 5-port router @28nm
  router_power_w: 0.8                 # 5-port router 功耗 @28nm (含 buffer 漏电)

  # ===========================================================================
  # 六、Crossbar 与 Buffer 模型 — 28nm NoC 文献数据
  # ===========================================================================
  #
  # crossbar 面积 = N² × crossbar_cell_mm2（O(N²) 交叉点矩阵）
  # buffer 面积 = total_buffer_bits / (sram_density × buffer_area_efficiency)
  #
  # 总 router 面积 = crossbar + buffer。这是 DieEstimator 的核心公式。
  #
  # 参考：5-port router 在 28nm 下约 1.5 mm²。
  #   验证: 5²×0.003 + 5×8VC×16×256/(10M×0.25) = 0.075 + 0.065 = 0.14 mm²
  #   实际 1.5mm² 说明 crossbar_cell 和 area_efficiency 需要校准。
  #   当前值朝着保守方向校准：crossbar_cell 取 0.01, area_efficiency 取 0.1。
  max_crossbar_ports: 256          # 单 die crossbar 端口数软上限

  crossbar_cell_mm2: 0.01          # 每个交叉点面积 (28nm, 校准到 ≈1.5mm² @5-port)

  buffer_vc_count: 8               # virtual channel 数
  buffer_depth: 16                 # 每个 VC 的 flit 深度
  flit_width: 256                  # flit 位宽

  sram_density_mbit_per_mm2: 10.0  # SRAM 密度 (28nm，纯 array)
  buffer_area_efficiency: 0.1      # SRAM 占 buffer 区域有效面积比
                                   # (含 address decoder, sense amp, margin)

  # ===========================================================================
  # 七、Die 固定开销
  # ===========================================================================

  base_die_area_mm2: 40               # PLL, 全局时钟树, power mesh, I/O ring,
                                      #   测试/DFT 逻辑, 芯片 ID/efuse 等
  base_power_w: 20                    # 漏电 (leakage), 时钟网络, PLL,
                                      #   常开域 (always-on), 温度传感器等
