[package]
name = "wafer-derangement"
version = "0.1.0"
edition = "2021"
description = "Max-weight derangement solver — reduces to Hungarian min-cost assignment"

[dependencies]
wafer-hungarian = { path = "../wafer-hungarian" }
wafer-core = { path = "../wafer-core", optional = true }

[features]
default = []
cli = ["wafer-core"]

[[bin]]
name = "wafer-derangement"
path = "src/main.rs"
required-features = ["cli"]
