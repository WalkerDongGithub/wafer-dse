[package]
name = "wafer-hungarian"
version = "0.1.0"
edition = "2021"
description = "Hungarian (Kuhn-Munkres) algorithm for min-cost perfect bipartite matching — O(N^3)"

[dependencies]
wafer-core = { path = "../wafer-core", optional = true }

[features]
default = []
cli = ["wafer-core"]

[[bin]]
name = "wafer-hungarian"
path = "src/main.rs"
required-features = ["cli"]
